<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARSHITA TOUR & TRAVELS - LUCKY SPIN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff1c7,#ffd27d);min-height:100vh;color:#542100}
.box{max-width:520px;margin:auto;padding:18px 12px 30px}.card{background:#fff;border-radius:28px;padding:20px 14px 26px;text-align:center;box-shadow:0 12px 35px #7b390033}
h1{font-size:24px;margin:0;color:#a52200}.tag{font-weight:bold;color:#c06b00;margin:6px 0 12px}
input{width:100%;padding:13px;margin:5px 0;border:2px solid #edbd62;border-radius:12px;font-size:16px}
.wheel{width:min(90vw,400px);aspect-ratio:1;margin:14px auto;position:relative}.pointer{position:absolute;z-index:2;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:38px solid #ad0000}
canvas{width:100%;height:100%;filter:drop-shadow(0 7px 8px #0003)}
button{border:0;border-radius:30px;background:#c62d00;color:white;font-weight:bold;font-size:19px;padding:14px 30px;box-shadow:0 5px #8d1e00;margin-top:5px}button:disabled{opacity:.55}
#result{min-height:32px;margin:18px 0 8px;font-size:20px;font-weight:bold;color:#08752f}.wa{display:none;background:#159447;box-shadow:0 5px #0b6d31}
.note{font-size:12px;color:#765b45;margin-top:12px}
</style>
</head>
<body>
<div class="box"><div class="card">
<h1>🚍 HARSHITA TOUR & TRAVELS 🎡</h1>
<div class="tag">LUCKY SPIN OFFER</div>
<input id="name" placeholder="ग्राहक का नाम">
<input id="phone" inputmode="numeric" maxlength="10" placeholder="मोबाइल नंबर">
<div class="wheel"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas></div>
<button id="spin">🎡 SPIN करें</button>
<div id="result"></div>
<button id="wa" class="wa">📲 WhatsApp पर Result भेजें</button>
<div class="note">एक Booking पर एक Spin • इनाम Booking की शर्तों के अनुसार मान्य</div>
</div></div>
<script>
const prizes=["उपसरपंच चाय","फ्री पानी की बोतल","फ्री गिफ्ट","अगली बुकिंग पर गिफ्ट","अगली बुकिंग पर विशेष छूट","बेस्ट ऑफ लक"];
const colors=["#ef5a20","#ffc33e","#ef5a20","#ffc33e","#ef5a20","#ffc33e"];
const c=document.getElementById("wheel"),ctx=c.getContext("2d"),spin=document.getElementById("spin"),result=document.getElementById("result"),wa=document.getElementById("wa");
let rotation=0,busy=false,lastPrize="";
function draw(){
 const cx=350,cy=350,r=320,n=prizes.length,a=2*Math.PI/n;
 ctx.clearRect(0,0,700,700);ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);
 for(let i=0;i<n;i++){
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,i*a,(i+1)*a);ctx.closePath();
  ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=8;ctx.stroke();
  ctx.save();ctx.rotate(i*a+a/2);ctx.fillStyle="#fff";ctx.font="bold 24px Arial";ctx.textAlign="right";ctx.textBaseline="middle";
  let text=prizes[i]; if(text.length>18) text=text.slice(0,18)+"…";ctx.fillText(text,r-18,0);ctx.restore();
 }
 ctx.beginPath();ctx.arc(0,0,64,0,Math.PI*2);ctx.fillStyle="#a90000";ctx.fill();
 ctx.fillStyle="#fff";ctx.font="bold 24px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("SPIN",0,0);ctx.restore();
}
draw();
spin.onclick=()=>{
 const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim();
 if(!name||!/^\d{10}$/.test(phone)){alert("कृपया नाम और सही 10 अंकों का मोबाइल नंबर भरें।");return}
 if(busy)return;busy=true;spin.disabled=true;wa.style.display="none";result.textContent="";
 const winner=Math.floor(Math.random()*prizes.length),a=2*Math.PI/prizes.length;
 const target=3*Math.PI/2-(winner*a+a/2);let delta=target-(rotation%(2*Math.PI));while(delta<0)delta+=2*Math.PI;
 const start=rotation,end=rotation+delta+8*Math.PI,t0=performance.now(),duration=4500;
 function animate(t){const p=Math.min(1,(t-t0)/duration),ease=1-Math.pow(1-p,4);rotation=start+(end-start)*ease;draw();
 if(p<1)requestAnimationFrame(animate);else{busy=false;spin.disabled=false;lastPrize=prizes[winner];result.textContent="🎉 बधाई "+name+" जी! आपने जीता: "+lastPrize+" 🎉";wa.style.display="inline-block";}}
 requestAnimationFrame(animate);
};
wa.onclick=()=>{
 const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim();
 const text=`🎉 HARSHITA TOUR & TRAVELS - LUCKY SPIN 🎉\n\nग्राहक: ${name}\nमोबाइल: ${phone}\nइनाम: ${lastPrize}\n\nधन्यवाद! 🚍`;
 window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
};
</script>
</body>
</html>
