<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harshita Tour & Travels - Booking Link Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff1cc,#ffd080);font-family:Arial,sans-serif;color:#4b2200}.wrap{max-width:520px;margin:auto;padding:18px 12px}.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 35px #7b390033}h1{margin:0;color:#a52200;font-size:24px;text-align:center}p{text-align:center;color:#79502b}label{font-weight:700;display:block;margin-top:12px}input,textarea{width:100%;padding:13px;margin-top:6px;border:2px solid #edbd62;border-radius:11px;font-size:16px}button{width:100%;border:0;border-radius:28px;background:#c72e00;color:white;font-weight:800;font-size:18px;padding:14px;margin-top:18px;box-shadow:0 5px #8c1f00}button:active{transform:translateY(3px);box-shadow:0 2px #8c1f00}.wa{display:none;background:#159447;box-shadow:0 5px #0b6d31}.out{display:none;margin-top:18px;padding:14px;background:#fff8e8;border-radius:14px}.link{word-break:break-all;font-size:13px;background:#fff;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🚍 HARSHITA TOUR & TRAVELS</h1>
<p>🎫 Booking Confirmation Link Generator</p>

<label>ग्राहक का नाम</label><input id="name" placeholder="जैसे: राम सिंह">
<label>ग्राहक का WhatsApp नंबर</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10 अंकों का नंबर">
<label>यात्रा की तारीख</label><input id="date" type="date">
<label>यात्रा / गंतव्य</label><input id="place" placeholder="जैसे: रामदेवरा">
<label>वाहन</label><input id="vehicle" placeholder="जैसे: Eeco / Ertiga">
<label>यात्री संख्या</label><input id="people" inputmode="numeric" placeholder="जैसे: 5">
<label>कुल Booking राशि</label><input id="total" inputmode="decimal" placeholder="₹">
<label>प्राप्त एडवांस</label><input id="advance" inputmode="decimal" placeholder="₹">
<label>Pickup स्थान</label><input id="pickup" placeholder="जैसे: खजुरी चंद्रावत">
<label>Reporting Time</label><input id="time" type="time">

<button id="make">🔗 Booking Link बनाएं</button>
<div id="out" class="out">
  <b>आपका WhatsApp Booking Link तैयार है:</b>
  <div id="link" class="link"></div>
  <button class="wa" id="open">📲 WhatsApp में Booking Message खोलें</button>
  <button id="copy">📋 Link Copy करें</button>
</div>
</div></div>

<script>
const $=id=>document.getElementById(id);
function val(id){return $(id).value.trim()}
function makeMessage(){
 const name=val("name"),date=val("date"),place=val("place"),vehicle=val("vehicle"),people=val("people"),total=val("total"),advance=val("advance"),pickup=val("pickup"),time=val("time");
 let d=date?new Date(date+"T00:00:00").toLocaleDateString("hi-IN",{day:"2-digit",month:"2-digit",year:"numeric"}):"-";
 let remaining=(total&&advance)?Math.max(0,Number(total)-Number(advance)):"-";
 return `🚍 HARSHITA TOUR & TRAVELS 🚍

🎫 BOOKING CONFIRMATION

नमस्कार ${name||"जी"} 🙏
आपकी यात्रा की Booking सफलतापूर्वक Confirm हो गई है। ✅

📋 Booking Details
👤 यात्री का नाम: ${name||"-"}
📅 यात्रा दिनांक: ${d}
📍 यात्रा / गंतव्य: ${place||"-"}
🚍 वाहन: ${vehicle||"-"}
👥 यात्री संख्या: ${people||"-"}
📍 Pickup स्थान: ${pickup||"-"}
⏰ Reporting Time: ${time||"-"}

💰 कुल Booking राशि: ₹${total||"-"}
💵 प्राप्त एडवांस: ₹${advance||"-"}
💳 शेष राशि: ₹${remaining}

🎡 आपकी Booking के साथ Lucky Spin Offer भी उपलब्ध है! 🎁
Spin करें और अपना इनाम पाएं:
https://harshitataourandtravels-dot.github.io/harshita-lucky-spin/

🙏 धन्यवाद
HARSHITA TOUR & TRAVELS
आपकी यात्रा, हमारी जिम्मेदारी।`;
}
let waUrl="";
$("make").onclick=()=>{
 if(!val("name")||!/^\d{10}$/.test(val("phone"))){alert("कृपया ग्राहक का नाम और सही 10 अंकों का WhatsApp नंबर भरें।");return}
 const msg=makeMessage(),phone="91"+val("phone");
 waUrl="https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
 $("link").textContent=waUrl;$("out").style.display="block";$("open").style.display="block";
};
$("open").onclick=()=>window.open(waUrl,"_blank");
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(waUrl);alert("Booking Link Copy हो गई ✅")}catch(e){prompt("Link Copy करें:",waUrl)}};
</script>
</body>
</html>
